<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">A gas-giant stripe changes identity with depth</title>
  <desc id="desc">The same Jovian belt and zone have different appearances to visible, infrared, and microwave instruments because each channel senses a different pressure-weighted layer and responds to temperature, composition, or clouds. Juno microwave belt-zone contrast reverses near the jovicline around five to ten bars. Gravity provides an integrated deep-flow constraint rather than a local thermal profile. A measurement ladder separates tracer color from a closed heat budget.</desc>
  <defs>
    <linearGradient id="jupiter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9d6ad"/><stop offset="0.2" stop-color="#a65f40"/><stop offset="0.39" stop-color="#f0dfb9"/><stop offset="0.58" stop-color="#b76e49"/><stop offset="0.78" stop-color="#eee0bd"/><stop offset="1" stop-color="#81513f"/></linearGradient>
    <linearGradient id="pressure" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f4f6"/><stop offset="0.45" stop-color="#8dbeca"/><stop offset="1" stop-color="#234f69"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.17"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#315f72"/></marker>
  </defs>
  <rect width="1400" height="980" fill="#f7f4ed"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="700" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#173444">A STRIPE CHANGES IDENTITY WITH DEPTH</text>
    <text x="700" y="78" text-anchor="middle" font-size="16" fill="#536a77">Visible belt ≠ temperature belt ≠ heat-content column ≠ heat transport</text>

    <g transform="translate(55 108)" filter="url(#shadow)">
      <rect width="360" height="510" rx="20" fill="#fff" stroke="#9c7a5f"/>
      <text x="180" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#694c39">VISIBLE APPEARANCE</text>
      <circle cx="180" cy="205" r="125" fill="url(#jupiter)"/>
      <path d="M62 173 Q180 150 298 173" fill="none" stroke="#f6e9c9" stroke-width="18" opacity="0.65"/>
      <path d="M62 230 Q180 252 298 230" fill="none" stroke="#774135" stroke-width="17" opacity="0.7"/>
      <ellipse cx="224" cy="237" rx="42" ry="24" fill="#a84836" stroke="#edc099" stroke-width="3"/>
      <text x="180" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a37">REFLECTED SUNLIGHT</text>
      <text x="180" y="383" text-anchor="middle" font-size="13" fill="#675c54">clouds · haze · particles</text>
      <text x="180" y="404" text-anchor="middle" font-size="13" fill="#675c54">illumination · viewing angle</text>
      <rect x="28" y="438" width="304" height="45" rx="12" fill="#f1e7db"/>
      <text x="180" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#74513b">TRACER MAP · NOT A THERMOMETER</text>
    </g>

    <g transform="translate(445 108)" filter="url(#shadow)">
      <rect width="500" height="510" rx="20" fill="#fff" stroke="#668fa0"/>
      <text x="250" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#214f65">PRESSURE-SENSITIVE COLUMN</text>
      <rect x="35" y="63" width="160" height="395" rx="15" fill="url(#pressure)"/>
      <g font-size="12" font-weight="700" fill="#214f65">
        <text x="212" y="89">0.1 bar · upper haze / stratospheric context</text>
        <text x="212" y="142">~1 bar · visible cloud tracers</text>
        <text x="212" y="207">1–5 bar · shallow microwave / weather layer</text>
        <text x="212" y="356">&gt;10 bar · deeper microwave contrast reverses</text>
        <text x="212" y="430">greater pressure · warmer, denser atmosphere</text>
      </g>
      <g stroke="#729daf" stroke-width="2" stroke-dasharray="6 6">
        <path d="M35 83 H195"/><path d="M35 136 H195"/><path d="M35 200 H195"/><path d="M35 273 H195"/><path d="M35 349 H195"/><path d="M35 423 H195"/>
      </g>
      <rect x="35" y="238" width="430" height="68" rx="12" fill="#f2c878" opacity="0.96"/>
      <text x="250" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#6d481d">5–10 BAR · JOVICLINE TRANSITION</text>
      <text x="250" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#6d481d">BELT / ZONE MICROWAVE CONTRAST FLIPS</text>
      <text x="250" y="295" text-anchor="middle" font-size="11" fill="#72583b">temperature + ammonia opacity remain entangled</text>
      <text x="250" y="485" text-anchor="middle" font-size="12" font-weight="700" fill="#315f72">PRESSURE IS NOT A SINGLE GEOMETRIC DEPTH</text>
    </g>

    <g transform="translate(975 108)" filter="url(#shadow)">
      <rect width="370" height="510" rx="20" fill="#fff" stroke="#668fa0"/>
      <text x="185" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#214f65">OBSERVATION OPERATORS</text>
      <g transform="translate(25 65)" font-size="12">
        <rect width="320" height="68" rx="13" fill="#e4eef1"/><text x="18" y="24" font-weight="700" fill="#214f65">VISIBLE / NEAR-IR</text><text x="18" y="45" fill="#506873">cloud reflectivity and tracer motion</text><text x="18" y="61" fill="#6f7e84">pressure level depends on opacity</text>
        <rect y="82" width="320" height="68" rx="13" fill="#d9e8ec"/><text x="18" y="106" font-weight="700" fill="#214f65">THERMAL INFRARED</text><text x="18" y="127" fill="#506873">temperature + composition retrieval</text><text x="18" y="143" fill="#6f7e84">broad contribution functions</text>
        <rect y="164" width="320" height="68" rx="13" fill="#cbdfe5"/><text x="18" y="188" font-weight="700" fill="#214f65">MICROWAVE</text><text x="18" y="209" fill="#506873">deeper brightness structure</text><text x="18" y="225" fill="#6f7e84">temperature + absorber opacity</text>
        <rect y="246" width="320" height="68" rx="13" fill="#bcd4dc"/><text x="18" y="270" font-weight="700" fill="#214f65">CLOUD-TRACKED WINDS</text><text x="18" y="291" fill="#506873">horizontal tracer velocity</text><text x="18" y="307" fill="#6f7e84">not a deep material profile</text>
        <rect y="328" width="320" height="68" rx="13" fill="#adc8d2"/><text x="18" y="352" font-weight="700" fill="#214f65">GRAVITY</text><text x="18" y="373" fill="#506873">integrated deep mass constraint</text><text x="18" y="389" fill="#6f7e84">model-dependent wind inversion</text>
      </g>
      <text x="185" y="486" text-anchor="middle" font-size="12" font-weight="700" fill="#315f72">NO CHANNEL SEES “THE DEPTH”</text>
    </g>

    <g transform="translate(55 652)" filter="url(#shadow)">
      <rect width="1290" height="272" rx="20" fill="#173444"/>
      <text x="645" y="31" text-anchor="middle" font-size="15" font-weight="700" fill="#9ed4e4">FROM ICONIC STRIPE TO DEFENSIBLE HEAT ZONE</text>
      <g transform="translate(30 58)" font-size="12" font-weight="700" text-anchor="middle">
        <rect width="150" height="65" rx="12" fill="#80543e"/><text x="75" y="29" fill="#fff">1 · TRACER</text><text x="75" y="48" fill="#f3d9c7">color / cloud</text>
        <path d="M157 32 H193" stroke="#91bdc8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="200" width="150" height="65" rx="12" fill="#315f72"/><text x="275" y="29" fill="#fff">2 · KERNEL</text><text x="275" y="48" fill="#d1e7ec">pressure sensitivity</text>
        <path d="M357 32 H393" stroke="#91bdc8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="400" width="170" height="65" rx="12" fill="#396b7e"/><text x="485" y="24" fill="#fff">3 · RETRIEVAL</text><text x="485" y="43" fill="#d1e7ec">temperature +</text><text x="485" y="58" fill="#d1e7ec">composition</text>
        <path d="M577 32 H613" stroke="#91bdc8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="620" width="150" height="65" rx="12" fill="#427487"/><text x="695" y="29" fill="#fff">4 · WIND</text><text x="695" y="48" fill="#d1e7ec">co-located velocity</text>
        <path d="M777 32 H813" stroke="#91bdc8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="820" width="170" height="65" rx="12" fill="#4b7d8f"/><text x="905" y="24" fill="#fff">5 · SHEAR</text><text x="905" y="43" fill="#d1e7ec">thermal-wind</text><text x="905" y="58" fill="#d1e7ec">consistency</text>
        <path d="M997 32 H1033" stroke="#91bdc8" stroke-width="4" marker-end="url(#arrow)"/>
        <rect x="1040" width="190" height="65" rx="12" fill="#e5edf0"/><text x="1135" y="24" fill="#173444">6–7 · FLUX + BUDGET</text><text x="1135" y="43" fill="#526d79">transport · storage</text><text x="1135" y="58" fill="#526d79">radiation · internal heat</text>
      </g>
      <g transform="translate(30 151)">
        <rect width="605" height="78" rx="14" fill="#294f61"/>
        <text x="302" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">EARTH LESSON THAT TRANSFERS</text>
        <text x="302" y="49" text-anchor="middle" font-size="13" fill="#cbe4ea">surface appearance can hide the consequential deep reservoir</text>
        <text x="302" y="66" text-anchor="middle" font-size="11" fill="#9fc9d3">vertical state before band name</text>
        <rect x="655" width="605" height="78" rx="14" fill="#294f61"/>
        <text x="957" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ANALOGY LIMIT</text>
        <text x="957" y="49" text-anchor="middle" font-size="13" fill="#cbe4ea">no seafloor, salinity front, or ice-shelf cavity at cloud level</text>
        <text x="957" y="66" text-anchor="middle" font-size="11" fill="#9fc9d3">shared diagnostics · different boundary conditions</text>
      </g>
      <text x="645" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#e9c583">THE VISIBLE STRIPE IS THE BEGINNING OF THE MEASUREMENT—NOT THE RESULT</text>
    </g>
  </g>
</svg>
