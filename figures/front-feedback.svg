<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950" role="img" aria-labelledby="title desc">
  <title id="title">How a front maintains itself and leaks</title>
  <desc id="desc">Two coupled loops explain a persistent ocean heat front. Buoyancy and wind create a density contrast and tilted density surfaces; rotation turns the pressure gradient into an along-front jet that inhibits cross-front mixing and preserves the contrast. Sloping density surfaces also feed baroclinic instability, eddies, and cross-front heat exchange that flatten the surfaces. Topography localizes leakage. A gas-giant panel identifies the controlled jet and potential-vorticity analogy. The front is a permeable, evolving balance rather than a fixed wall, and the planetary comparison is mechanistic rather than an identity claim.</desc>
  <defs>
    <linearGradient id="stable" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dff1f4"/><stop offset="1" stop-color="#b9dce4"/></linearGradient>
    <linearGradient id="eddy" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff0ce"/><stop offset="1" stop-color="#f2c77b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.17"/></filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#39758d"/></marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c9852e"/></marker>
  </defs>
  <rect width="1400" height="950" fill="#f7f4ed"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="700" y="48" text-anchor="middle" font-size="31" font-weight="700" fill="#173444">HOW A FRONT MAINTAINS ITSELF—AND LEAKS</text>
    <text x="700" y="78" text-anchor="middle" font-size="16" fill="#536a77">The jet-building loop and the eddy-relaxation loop operate at the same time</text>

    <g transform="translate(55 108)" filter="url(#shadow)">
      <rect width="1290" height="105" rx="18" fill="#173444"/>
      <text x="645" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="#9ed4e4">ROTATING-FLUID BRIDGE</text>
      <text x="324" y="61" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">GEOSTROPHY</text>
      <text x="324" y="85" text-anchor="middle" font-size="14" fill="#cce7ed">horizontal pressure gradient → flow mainly along the front</text>
      <path d="M645 23 V88" stroke="#6e95a5" stroke-width="2"/>
      <text x="966" y="61" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">THERMAL-WIND BALANCE</text>
      <text x="966" y="85" text-anchor="middle" font-size="14" fill="#cce7ed">horizontal density gradient ↔ vertical shear of the jet</text>
    </g>

    <g transform="translate(55 245)" filter="url(#shadow)">
      <rect width="810" height="430" rx="20" fill="#fff" stroke="#72a0b1"/>
      <rect width="810" height="52" rx="20" fill="#235a70"/>
      <path d="M0 52 H810" stroke="#235a70" stroke-width="20"/>
      <text x="405" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">LOOP A · BUILD AND PRESERVE THE FRONT</text>

      <g transform="translate(35 84)">
        <g transform="translate(0 0)"><rect width="215" height="94" rx="15" fill="url(#stable)" stroke="#77a8b7"/><text x="107" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566d">1 · FORCING</text><text x="107" y="53" text-anchor="middle" font-size="13" fill="#405f6c">heating, cooling, freshwater,</text><text x="107" y="72" text-anchor="middle" font-size="13" fill="#405f6c">wind, and water-mass history</text></g>
        <g transform="translate(280 0)"><rect width="215" height="94" rx="15" fill="url(#stable)" stroke="#77a8b7"/><text x="107" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566d">2 · DENSITY CONTRAST</text><text x="107" y="53" text-anchor="middle" font-size="13" fill="#405f6c">temperature + salinity create</text><text x="107" y="72" text-anchor="middle" font-size="13" fill="#405f6c">tilted isopycnal surfaces</text></g>
        <g transform="translate(560 0)"><rect width="215" height="94" rx="15" fill="url(#stable)" stroke="#77a8b7"/><text x="107" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566d">3 · JET + SHEAR</text><text x="107" y="53" text-anchor="middle" font-size="13" fill="#405f6c">rotation redirects pressure</text><text x="107" y="72" text-anchor="middle" font-size="13" fill="#405f6c">acceleration along the front</text></g>
        <g transform="translate(420 190)"><rect width="260" height="104" rx="15" fill="#d4e9ee" stroke="#638fa0"/><text x="130" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566d">4 · TRANSPORT BARRIER</text><text x="130" y="54" text-anchor="middle" font-size="13" fill="#405f6c">strong jet / PV gradient inhibits</text><text x="130" y="73" text-anchor="middle" font-size="13" fill="#405f6c">cross-front tracer exchange</text><text x="130" y="92" text-anchor="middle" font-size="11" fill="#657b84">inhibits ≠ stops</text></g>
        <g transform="translate(95 190)"><rect width="260" height="104" rx="15" fill="#d4e9ee" stroke="#638fa0"/><text x="130" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1f566d">5 · CONTRAST PERSISTS</text><text x="130" y="54" text-anchor="middle" font-size="13" fill="#405f6c">reduced exchange helps preserve</text><text x="130" y="73" text-anchor="middle" font-size="13" fill="#405f6c">the front that supports the jet</text><text x="130" y="92" text-anchor="middle" font-size="11" fill="#657b84">a maintained nonequilibrium</text></g>

        <g fill="none" stroke="#39758d" stroke-width="4" marker-end="url(#arrowBlue)">
          <path d="M220 47 H272"/><path d="M500 47 H552"/><path d="M667 101 C667 138 644 160 604 181"/><path d="M415 242 H363"/><path d="M95 242 C28 224 24 137 83 102"/>
        </g>
      </g>
      <text x="405" y="407" text-anchor="middle" font-size="13" font-weight="700" fill="#315f72">POSITIVE MAINTENANCE LOOP · STRUCTURE WITHOUT A SOLID WALL</text>
    </g>

    <g transform="translate(895 245)" filter="url(#shadow)">
      <rect width="450" height="430" rx="20" fill="#fff" stroke="#c28a3b"/>
      <rect width="450" height="52" rx="20" fill="#8a5a25"/>
      <path d="M0 52 H450" stroke="#8a5a25" stroke-width="20"/>
      <text x="225" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">LOOP B · RELEASE AND LEAK</text>

      <g transform="translate(30 75)">
        <rect width="390" height="58" rx="14" fill="url(#eddy)" stroke="#c89448"/>
        <text x="195" y="23" text-anchor="middle" font-size="14" font-weight="700" fill="#704819">SLOPING ISOPYCNALS STORE</text><text x="195" y="43" text-anchor="middle" font-size="13" fill="#725b3b">available potential energy</text>
        <path d="M195 64 V82" stroke="#c9852e" stroke-width="4" marker-end="url(#arrowGold)"/>
        <rect y="88" width="390" height="58" rx="14" fill="url(#eddy)" stroke="#c89448"/>
        <text x="195" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="#704819">BAROCLINIC INSTABILITY</text><text x="195" y="131" text-anchor="middle" font-size="13" fill="#725b3b">converts part of that energy into eddies</text>
        <path d="M195 152 V170" stroke="#c9852e" stroke-width="4" marker-end="url(#arrowGold)"/>
        <rect y="176" width="390" height="72" rx="14" fill="#f6dcae" stroke="#c89448"/>
        <text x="195" y="199" text-anchor="middle" font-size="14" font-weight="700" fill="#704819">EDDIES + MEANDERS</text><text x="195" y="220" text-anchor="middle" font-size="13" fill="#725b3b">carry heat and tracers across the mean jet</text><text x="195" y="239" text-anchor="middle" font-size="12" fill="#806c50">exchange concentrates near topography</text>
        <path d="M195 254 V272" stroke="#c9852e" stroke-width="4" marker-end="url(#arrowGold)"/>
        <rect y="278" width="390" height="53" rx="14" fill="#f6e5c8" stroke="#c89448"/>
        <text x="195" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#704819">FLATTEN / RELAX THE GRADIENT</text><text x="195" y="318" text-anchor="middle" font-size="12" fill="#725b3b">partial counter-loop, not total erasure</text>
      </g>
    </g>

    <g transform="translate(55 710)" filter="url(#shadow)">
      <rect width="1290" height="185" rx="20" fill="#173444"/>
      <text x="645" y="31" text-anchor="middle" font-size="15" font-weight="700" fill="#9ed4e4">THE DYNAMIC EQUILIBRIUM</text>
      <g transform="translate(35 55)">
        <rect width="365" height="78" rx="14" fill="#2c6379"/><text x="182" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">WIND + BUOYANCY</text><text x="182" y="50" text-anchor="middle" font-size="13" fill="#cce7ed">build and steepen gradients</text><text x="182" y="68" text-anchor="middle" font-size="11" fill="#a9ccd5">energy enters the mean state</text>
        <text x="425" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#e9c583">⇄</text>
        <rect x="485" width="365" height="78" rx="14" fill="#875b2a"/><text x="667" y="27" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">EDDIES + MIXING</text><text x="667" y="50" text-anchor="middle" font-size="13" fill="#f7deb7">leak heat and relax gradients</text><text x="667" y="68" text-anchor="middle" font-size="11" fill="#e5c899">energy enters transient motion</text>
        <rect x="910" width="310" height="78" rx="14" fill="#e6eef1"/><text x="1065" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#173444">GAS-GIANT ANALOG</text><text x="1065" y="46" text-anchor="middle" font-size="12" fill="#4f6874">jets and PV gradients organize</text><text x="1065" y="64" text-anchor="middle" font-size="12" fill="#4f6874">exchange without continents</text>
      </g>
      <text x="645" y="166" text-anchor="middle" font-size="12" font-weight="700" fill="#e9c583">PERSISTENCE DOES NOT REQUIRE IMMOBILITY · LEAKAGE DOES NOT REQUIRE BARRIER FAILURE</text>
    </g>
  </g>
</svg>
